name: Optimize Images

on:
  push:
    paths:
      - "originals/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Pillow
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Optimize images
        run: |
          python <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path("originals")
          output = Path("gallery")

          output.mkdir(exist_ok=True)

          extensions = {
              ".jpg",
              ".jpeg",
              ".png",
              ".webp"
          }

          source_files = []

          for file in source.rglob("*"):
              if file.is_file() and file.suffix.lower() in extensions:
                  source_files.append(file)

                  relative = file.relative_to(source)
                  destination = output / relative
                  destination = destination.with_suffix(".webp")

                  destination.parent.mkdir(
                      parents=True,
                      exist_ok=True
                  )

                  with Image.open(file) as image:

                      if image.mode not in ("RGB", "RGBA"):
                          image = image.convert("RGB")

                      image.thumbnail(
                          (1600, 1600),
                          Image.Resampling.LANCZOS
                      )

                      image.save(
                          destination,
                          "WEBP",
                          quality=82,
                          method=6
                      )

                  print(
                      f"Optimized: {file} -> {destination}"
                  )

          # Remove generated images that no longer
          # have a corresponding original.
          expected = set()

          for file in source_files:
              relative = file.relative_to(source)
              expected.add(
                  (output / relative).with_suffix(".webp")
              )

          for file in output.rglob("*.webp"):
              if file not in expected:
                  file.unlink()
                  print(f"Removed: {file}")
          PY

      - name: Commit optimized images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add gallery

          if git diff --cached --quiet; then
            echo "No image changes."
          else
            git commit -m "Auto optimize images"
            git push
          fi
